# PR-04 case the_new_patient-cba21da07f8a — Joaquín González Ortega (not on file -> REGISTER,
# never BOOK). Verified live: national_id=18921027P returns 0 directory matches.
# GAP: there is no registration flow at all today. server/handlers.py's search_patient
# not_found path only retries the identifier up to MAX_IDENTIFY_ATTEMPTS and then gives up with
# NO_ACTION(patient_not_found) (server/handlers.py:44-78) — it never offers to register a
# genuinely new caller. This needs a new node + a register_patient tool posting the flat
# REGISTER body (FR-register), reachable from the "not_found" branch once the bot has asked
# enough to be confident this is a new patient rather than a misheard identifier.
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: the_new_patient_joaquin
turns:
  - user: "Hello, I don't think I've been to your clinic before. My name is Joaquín González Ortega."
    expect:
      - event: response
        eval: "the bot asks for an identifier (DNI/NIE or phone) to check the records"
  - user: "My DNI is 18921027P."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: response
        eval: "the bot says it cannot find them and offers to register them as a new patient instead of retrying the identifier as if it were misheard"
  - user: "Yes, please register me. My date of birth is the 25th of June 1970, my phone is 783 869 132, my email is joaquingonzalez24@hotmail.com, and I'm insured with Cigna."
    expect:
      - event: function_call
        calls:
          - name: register_patient
            args:
              given_name: Joaquín
              first_surname: González
              second_surname: Ortega
              national_id: 18921027P
              insurer: cigna
      - event: response
        eval: "the bot confirms the registration and does not offer or book any appointment"
