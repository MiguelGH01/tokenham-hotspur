# PR-04 case the_new_patient-dbb48077d9df — Natalia Muñoz González (not on file -> REGISTER,
# never BOOK; homonym trap). Verified live: a name-only /directory search returns an existing
# P01239 Natalia Muñoz González (DOB 2005-11-21), but the caller's exact national_id
# (50454876Y, DOB 1988-12-13) matches nobody — 0 exact matches.
# GAP: same missing registration flow as the_new_patient_joaquin.yaml. Also exercises
# FR-register-homonym: search_patient already filters matches down to an exact id/phone match
# (server/handlers.py:66, the `exact` lambda), so a name-only hit on the homonym should not
# surface as `found` here — confirm the bot does not book P01239.
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: the_new_patient_natalia
turns:
  - user: "Hello, I don't think I'm in your system yet. Natalia Muñoz González, DNI 50454876Y."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: response
        eval: "the bot says it cannot find a matching record for that DNI and offers to register a new patient — it does not book or confirm an existing appointment for a Natalia Muñoz González already on file, since that is a different person"
  - user: "Yes, register me. Born the 13th of December 1988, phone 797 574 941, email natalia.munoz86@hotmail.com, insured with Sanitas."
    expect:
      - event: function_call
        calls:
          - name: register_patient
            args:
              given_name: Natalia
              first_surname: Muñoz
              second_surname: González
              national_id: 50454876Y
              insurer: sanitas
      - event: response
        eval: "the bot confirms the registration and does not offer or book any appointment"
