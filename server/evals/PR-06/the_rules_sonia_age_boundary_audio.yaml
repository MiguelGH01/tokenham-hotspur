# Audio sibling of the_rules_sonia_age_boundary.yaml — see
# simple_booking_josefa_audio.yaml for why this is a separate file. Longest/most complex
# utterance of the set (third-party caller + age redirect), a good stress test for STT
# plus the reasoning-leak guard together.
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
    sample_rate: 16000
judge:
  modality: audio
  transcription:
    service: moonshine
  eval:
    factory: eval_judge.helmcode_judge
name: the_rules_sonia_age_boundary_audio
turns:
  - user: "Hi, this is Sonia's mother. My daughter is Sonia Álvarez Medina, DNI 6 2 8 1 9 2 5 7 R — she's due her routine check-up, could I get her the earliest General Practice appointment?"
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
      - event: response
        eval: "the response books the child into paediatrics, not general practice, because at age 9 she is under the general-practice age boundary — it does not refuse the booking for being ineligible"
  - user: "Yes, that's fine."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
