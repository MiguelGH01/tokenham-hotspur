# PR-06 case the_rules-8d92ce10f4a6 — Sonia Álvarez Medina (a parent asks for "General
# Practice" for their daughter's check-up; age boundary wins over the spoken specialty, and the
# patient booked is the child, not the calling parent). Verified live: P00009 DOB 2017-05-12
# (age 9), insurer privado, referrals=[orthopaedics]. /availability for general_practice on her
# returns blocked=[not_eligible_age for every GP provider] with 0 slots; paediatrics has slots.
# GAP: booking.get_earliest_slot (server/handlers.py:81) passes the caller's specialty straight
# through and never reads the `blocked` array the API returns — no age-remap logic exists yet
# (FR-age-remap), and there is no third-party ("caller isn't the patient") handling either
# (FR-third-party) — search_patient assumes the stated name/id are the patient's own.
# Expected BOOK: P00009 / PR08 / norte / paediatric_review / 2026-09-21T10:00:00+02:00 / privado
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: the_rules_sonia_age_boundary
turns:
  - user: "Hi, this is Sonia's mother. My daughter is Sonia Álvarez Medina, DNI 62819257R — she's due her routine check-up, could I get her the earliest General Practice appointment?"
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
      - event: response
        eval: "the response books the child into paediatrics, not general practice, because at age 9 she is under the general-practice age boundary — it does not refuse the booking for being ineligible"
  - user: "Yes, that's fine."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
