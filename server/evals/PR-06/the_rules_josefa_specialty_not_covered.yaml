# PR-06 case the_rules-460d9e84504a — Josefa Sánchez Gutiérrez (asks for earliest Gynaecology;
# Adeslas does not cover gynaecology at all, and there is only one gynaecologist to redirect to
# -> NO_ACTION(specialty_not_covered), not referral_required and not a booking).
# Verified live: P00015 DOB 1967-03-20, Adeslas, has_visited_before=false, referrals=[].
# /availability for gynaecology on her returns 0 slots and
# blocked=[specialty_not_covered for PR11 Montoro] — matches clinic.json's Adeslas plan, whose
# uncovered_specialty_names includes Gynaecology.
# GAP: same missing NO_ACTION/blocked-reading logic as the_rules_teresa_referral_required.yaml.
# The wrong outcomes to watch for are treating this as a referral problem (gynae is not
# referral-gated) or inventing a booking under a different plan.
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: the_rules_josefa_specialty_not_covered
turns:
  - user: "Hi, Josefa Sánchez Gutiérrez, DNI 49526979K. I'd like my yearly Gynaecology check-up, earliest available."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: gynaecology }
      - event: response
        eval: "the bot explains her plan does not cover gynaecology at any site, does not ask for a referral (this is not a referral problem), and does not book any appointment"
