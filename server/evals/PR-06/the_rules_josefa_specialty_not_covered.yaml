# PR-06 The Rules — case the_rules-460d9e84504a
#
# The law, not the fixture: when a plan refuses the specialty itself, there is
# nowhere to redirect to, so the refusal IS the answer. The reason submitted
# must be specialty_not_covered — not referral_required (gynaecology is not
# referral-gated) and not not_eligible_age (the patient is an adult).
#
# Patient P00015 Josefa Sánchez Gutiérrez, DOB 1967-03-20, Adeslas.
# Adeslas is the plan that refuses gynaecology, and the clinic has one
# gynaecologist, so no redirect can exist for this shape on any plan.
name: pr06_specialty_not_covered
judge:
  eval:
    factory: "eval_judge.helmcode_judge"
turns:
  - expect:
      - event: response

  - user: "Good morning, I'd like to book my yearly gynaecology check-up."
    expect:
      - event: response

  - user: "Josefa Sánchez Gutiérrez, my DNI is 49526979K."
    expect:
      - event: function_call
        calls:
          - name: search_patient
      - event: response

  - user: "The earliest one you have, please."
    expect:
      - event: function_call
        calls:
          - name: get_earliest_slot
      - event: response
        eval: >
          explains that this patient's insurance does not cover gynaecology, and
          offers no appointment at all — not gynaecology, not another specialty
          and not another doctor. It must not ask about a referral, must not
          mention the patient's age, and must not offer to book anything.
