# PR-05 When Exactly — case when_exactly-b1f6c257c34c
#
# The law, not the fixture: a requested day on which nothing opens rolls forward
# to the next open day that still matches the rest of the ask — site, specialty
# and part of day. Sunday is not "skip to next week"; it is "the next day the
# clinic is open".
#
# Clock pinned to Friday 18 September 2026.
#   make eval-one S=pr05_sunday_rolls_to_monday CLOCK=2026-09-18T10:00:00+02:00
#
# Patient P00011 Chloe Roberts Smith, Mapfre, returning. Centro is shut Sunday,
# so the next open day matching Centro + GP + morning is Monday 21 September.
name: pr05_sunday_rolls_to_monday
judge:
  eval:
    factory: "eval_judge.helmcode_judge"
turns:
  - expect:
      - event: response

  - user: "Hi, I need a repeat prescription from the GP at Arenal Centro this coming Sunday."
    expect:
      - event: response

  - user: "Chloe Roberts Smith, DNI Z4237244M."
    expect:
      - event: function_call
        calls:
          - name: search_patient
      - event: response

  - user: "Yes, Arenal Centro, please, the earliest you can."
    expect:
      - event: function_call
        calls:
          - name: get_earliest_slot
      - event: response
        eval: >
          offers a concrete GP appointment at Arenal Centro (a doctor plus a day
          and time), or says nothing is free. The day offered must be Monday the
          twenty-first of September — a Sunday is impossible. It must NOT offer
          another site as a way to keep the Sunday, and must not refuse.
