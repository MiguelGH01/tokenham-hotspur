# PR-05 case when_exactly-b1f6c257c34c — Chloe Roberts Smith (GP at Centro "this coming Sunday")
# Default CALL_CLOCK_OVERRIDE=2026-09-18T10:00:00+02:00 -> "this coming Sunday" = 20 Sep.
# GAP: booking.pick_offer (server/booking.py) filters strictly on the requested weekday and has
# no closed-day rollover (FR-closed-day-roll). Since nothing opens Sunday, the current
# get_earliest_slot returns no_slots instead of rolling to the next open day. This scenario is
# the target behaviour, not what today's implementation does — expect it red until that's built.
# Expected BOOK: P00011 / PR01 / centro / review / 2026-09-21T09:15:00+02:00 / mapfre
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: when_exactly_chloe_sunday_rollover
turns:
  - user: "Hi, Chloe Roberts Smith, NIE Z4237244M. I need a repeat prescription, GP at Arenal Centro this coming Sunday please."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: general_practice, site: centro, weekday: sunday }
      - event: response
        eval: "the response does not offer a Sunday appointment (the clinic is closed Sunday) and instead offers the earliest open day at Arenal Centro, which should be Monday 21 September"
  - user: "That's fine, book it."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
