# PR-05 case when_exactly-34e8e0acadb6 — Amelia Hughes White (GP at Centro, "first thing
# Monday the twelfth of October")
# Requires CALL_CLOCK_OVERRIDE set close to end of September (e.g. 2026-09-29T10:00:00+02:00)
# so the 14-day /availability window reaches 12-13 Oct — the default 18 Sep override does not.
# GAP x2: (1) get_earliest_slot has no way to pin an exact calendar date, only a cyclic
# weekday — "Monday 12 Oct" cannot be expressed with the current schema. (2) even with a date
# argument, /availability itself still lists slots on the Fiesta Nacional closure day
# (verified live: 2026-10-12 returns slots for PR01/PR07 at centro) — the agent must not book
# them and must roll to the next open day (13 Oct) instead. Written as the target behaviour;
# expect red until both are built.
# Expected BOOK: P00012 / PR01 / centro / first_visit / 2026-10-13T09:45:00+02:00 / sanitas
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: when_exactly_amelia_fiesta_rollover
turns:
  - user: "Hello, Amelia Hughes White, DNI 13309713G. My blood pressure needs checking — first thing on Monday the twelfth of October, at Arenal Centro please."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
      - event: response
        eval: "the response does not offer 12 October (the network is shut for Fiesta Nacional that day even though slots were technically listed) and instead offers the first morning appointment on Tuesday 13 October at Arenal Centro"
  - user: "Yes please."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
