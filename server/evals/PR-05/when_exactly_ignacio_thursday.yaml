# PR-05 case when_exactly-72cdb35b9682 — Ignacio Vázquez Moreno (orthopaedics "this coming Thursday")
# clock: 2026-09-18T10:00:00+02:00
# Pinned to Friday 18 Sep (Friday) -> "this coming Thursday" = 24 Sep.
# weekday=thursday is already a supported get_earliest_slot argument.
# Expected BOOK: P00005 / PR06 / centro / orthopaedic_review / 2026-09-24T09:15:00+02:00 / cigna
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: when_exactly_ignacio_thursday
turns:
  - user: "Hello, Ignacio Vázquez Moreno here, my phone is 731 169 716. My hip's been bad, could I see orthopaedics this coming Thursday?"
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: phone }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: orthopaedics, weekday: thursday }
      - event: response
        eval: "the response offers an appointment on Thursday 24 September with Dr. Iglesia, not Dra. Iglesias"
  - user: "Perfect, book that."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
