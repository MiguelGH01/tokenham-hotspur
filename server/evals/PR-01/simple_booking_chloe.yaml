# PR-01 case simple_booking-b33e7e633856 — Chloe Roberts Smith (NIE, returning, GP at Arenal Sur, Monday morning)
# Expected BOOK: P00011 / PR03 / sur / review / 2026-09-21T09:00:00+02:00 / mapfre
judge:
  eval:
    factory: eval_judge.helmcode_judge
name: simple_booking_chloe
turns:
  - user: "Hi, Chloe Roberts Smith here, my NIE is Z4237244M. I'd like to make an appointment."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: response
  - user: "With a GP at Arenal Sur, on a Monday morning please."
    expect:
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: general_practice, site: sur, weekday: monday, part_of_day: morning }
      - event: response
  - user: "Great, yes."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
