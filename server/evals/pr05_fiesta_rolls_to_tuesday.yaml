# PR-05 When Exactly — case when_exactly-34e8e0acadb6
#
# The law, not the fixture: a named date that falls on a listed closure rolls to
# the next open day, and the named weekday is deliberately dropped while
# "first thing" (morning) is kept. `availability` still lists slots on the
# closure day, so booking the named Monday is the trap.
#
# Clock pinned to Friday 18 September 2026.
#   make eval-one S=pr05_fiesta_rolls_to_tuesday CLOCK=2026-09-18T10:00:00+02:00
#
# Patient P00012 Amelia Hughes White, Sanitas, never seen → first_visit.
# Monday 12 October 2026 is Fiesta Nacional; the answer is Tuesday 13 October.
name: pr05_fiesta_rolls_to_tuesday
judge:
  eval:
    factory: "bot.build_eval_judge_llm"
turns:
  - expect:
      - event: response

  - user: "I'd like to come in for a blood pressure check, first thing on Monday the twelfth of October."
    expect:
      - event: response

  - user: "Amelia Hughes White, DNI 13309713G. At Arenal Centro with the GP."
    expect:
      - event: function_call
        calls:
          - name: search_patient
      - event: response

  - user: "Yes, first thing in the morning, please."
    expect:
      - event: function_call
        calls:
          - name: get_earliest_slot
      - event: response
        eval: >
          offers a concrete morning appointment (a doctor plus a day and time),
          or says nothing is free. The day offered must NOT be Monday the twelfth
          of October — the clinic is closed that day — and must be Tuesday the
          thirteenth of October if nothing is free earlier. Naming Tuesday the
          13th passes; mentioning Monday the 12th as the day of the appointment
          fails.
