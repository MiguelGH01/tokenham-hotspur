# Audio sibling of doctor_and_site_mario_wrong_weekday.yaml — see
# simple_booking_josefa_audio.yaml for why this is a separate file. Real turn detection
# on a longer name-plus-named-provider-plus-weekday utterance.
# CALL_CLOCK_OVERRIDE=2026-09-18T10:00:00+02:00
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
    sample_rate: 16000
judge:
  modality: audio
  transcription:
    service: moonshine
  eval:
    factory: eval_judge.helmcode_judge
name: doctor_and_site_mario_wrong_weekday_audio
turns:
  - user: "Hello, Mario Gómez Blanco, DNI X 2 2 4 5 8 7 6 H. I'd like to see Dr. Sáez at Arenal Centro, on a Monday if possible."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: general_practice, site: centro }
      - event: response
        eval: "the response explains Dr. Sáez is not at Arenal Centro on Mondays and offers his earliest slot there on the day he does hold Centro hours (Friday), rather than switching to a different doctor or a different site"
  - user: "Alright, Friday works, book it."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
