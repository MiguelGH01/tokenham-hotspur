# submit: BOOK P00057 PR12 norte dermatology_review dkv
# AUDIO version of PR-06/the_rules_gloria_plan_redirect.yaml: the caller speaks, so VAD, STT and TTS run.
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
judge:
  modality: audio
  transcription:
    service: moonshine
  eval:
    factory: eval_judge.helmcode_judge
name: audio_the_rules_gloria_plan_redirect
turns:
  - user: "Hello, Gloria González Blanco, DNI 15750638P. I've got an eczema flare-up, could I see Dra. Iglesias?"
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: dermatology }
      - event: response
        eval: "the response says Dra. Iglesias does not take her plan and offers instead an appointment with Dr. Vilar in dermatology, rather than refusing the booking outright"
  - user: "That's fine, book Dr. Vilar."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
