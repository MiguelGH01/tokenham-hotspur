# submit: BOOK P01842 PR01 centro review privado
# AUDIO version of PR-03/doctor_and_site_joaquin.yaml: the caller speaks, so VAD, STT and TTS run.
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
judge:
  modality: audio
  transcription:
    service: moonshine
  eval:
    factory: eval_judge.helmcode_judge
name: audio_doctor_and_site_joaquin
turns:
  - user: "Hello, Joaquín Ramírez Delgado, DNI 20206861G. I'd like an appointment with Dra. Ortiz Vidal at Arenal Centro, whenever she's free soonest."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: general_practice, site: centro }
      - event: response
        eval: "the response offers an appointment specifically with Dra. Ortiz Vidal at Arenal Centro, not another doctor"
  - user: "Yes, that's great."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
