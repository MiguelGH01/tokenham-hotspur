user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
judge:
  modality: audio
  transcription:
    service: moonshine
  eval:
    factory: eval_judge.helmcode_judge
name: audio_doctor_and_site_andres_leave
turns:
  - user: "Good morning, Andrés Rubio Vázquez, DNI 63663395Q. Could I get an appointment with Dr. Requena at Arenal Norte?"
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
