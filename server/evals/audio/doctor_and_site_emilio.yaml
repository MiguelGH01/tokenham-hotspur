# submit: BOOK P01850 PR03 sur review mapfre
# AUDIO version of PR-03/doctor_and_site_emilio.yaml: the caller speaks, so VAD, STT and TTS run.
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
judge:
  modality: audio
  transcription:
    service: moonshine
  eval:
    factory: eval_judge.helmcode_judge
name: audio_doctor_and_site_emilio
turns:
  - user: "Hi, this is Emilio Rubio Jiménez, DNI 50714604H. I'd like to see Dr. Sáez, the GP, at Arenal Sur please."
    expect:
      - event: function_call
        calls:
          - name: search_patient
            args: { id_type: national_id }
      - event: function_call
        calls:
          - name: get_earliest_slot
            args: { specialty: general_practice, site: sur }
      - event: response
        eval: "the response offers an appointment with Dr. Sáez the general practitioner, and does not confuse him with Dra. Sáenz the paediatrician"
  - user: "Yes, book it."
    expect:
      - event: function_call
        calls:
          - name: confirm_offer
            args: { offer_id: offer-1 }
      - event: response
