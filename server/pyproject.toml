[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,deepgram,elevenlabs,evals,google,openai,rnnoise,runner,silero,soniox,webrtc,websocket]>=1.11.0",
    "pipecat-ai[daily]>=1.11.0; sys_platform != 'win32'",
    "httpx",
    "tzdata",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
