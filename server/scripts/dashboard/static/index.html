<title>Clinic Bot Run Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --surface-3:#e3e6ec;
    --border:#dbdfe6; --text:#1a1d24; --text-dim:#5b6270; --text-faint:#8790a0;
    --accent:#3357d6; --accent-weak:#e7ebfc;
    --pass:#128a5e; --pass-weak:#e3f6ee;
    --fail:#c8342f; --fail-weak:#fceceb;
    --warn:#a06400; --warn-weak:#fbf0dc;
    --neutral:#5b6270; --neutral-weak:#e9eaed;
    --lane-turn:#3357d6; --lane-llm:#7a4fd6; --lane-fn:#0f8f7a; --lane-speech:#c8342f; --lane-speech-fill:#f6d9d7;
    --role-assistant:#b4600a; --role-assistant-weak:#fbead2;
    --tint-a:rgba(0,0,0,.03); --tint-b:rgba(0,0,0,.065);
    --radius:10px;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1015; --surface:#161922; --surface-2:#1c202a; --surface-3:#242936;
      --border:#2b303c; --text:#e8eaef; --text-dim:#a3aabb; --text-faint:#6b7284;
      --accent:#7f9bff; --accent-weak:#1c2444;
      --pass:#3ddc97; --pass-weak:#12271f;
      --fail:#ff6f6b; --fail-weak:#301616;
      --warn:#ffc266; --warn-weak:#2e2311;
      --neutral:#a3aabb; --neutral-weak:#242936;
      --lane-turn:#7f9bff; --lane-llm:#b79bff; --lane-fn:#3ddc97; --lane-speech:#ff6f6b; --lane-speech-fill:#3a2020;
      --role-assistant:#ffb066; --role-assistant-weak:#332210;
      --tint-a:rgba(255,255,255,.035); --tint-b:rgba(255,255,255,.075);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1015; --surface:#161922; --surface-2:#1c202a; --surface-3:#242936;
    --border:#2b303c; --text:#e8eaef; --text-dim:#a3aabb; --text-faint:#6b7284;
    --accent:#7f9bff; --accent-weak:#1c2444;
    --pass:#3ddc97; --pass-weak:#12271f;
    --fail:#ff6f6b; --fail-weak:#301616;
    --warn:#ffc266; --warn-weak:#2e2311;
    --neutral:#a3aabb; --neutral-weak:#242936;
    --lane-turn:#7f9bff; --lane-llm:#b79bff; --lane-fn:#3ddc97; --lane-speech:#ff6f6b; --lane-speech-fill:#3a2020;
    --role-assistant:#ffb066; --role-assistant-weak:#332210;
    --tint-a:rgba(255,255,255,.035); --tint-b:rgba(255,255,255,.075);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.45;
  }
  .app{ padding: 20px clamp(16px, 3vw, 32px) 40px; max-width:1400px; margin:0; }

  header.top{ display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; justify-content:space-between; margin-bottom:18px; }
  .title-block h1{ font-size:20px; margin:0 0 4px; letter-spacing:-0.01em; }
  .title-block .sub{ color:var(--text-dim); font-size:12.5px; font-family:var(--mono); }
  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 16px; min-width:88px; text-align:left;
  }
  .stat .num{ font-family:var(--mono); font-size:22px; font-weight:600; line-height:1; }
  .stat .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-top:4px; }
  .stat.fail-tile{ border-color:var(--fail); background:var(--fail-weak); }
  .stat.fail-tile .num{ color:var(--fail); }
  .stat.pass-tile .num{ color:var(--pass); }

  .layout{ display:grid; grid-template-columns: 300px minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }

  .sidebar{ padding:12px; position:sticky; top:16px; }
  .filters{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .chip{
    font-family:var(--mono); font-size:11.5px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-dim); padding:4px 9px; border-radius:999px; cursor:pointer; user-select:none;
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .scenario-list{ display:flex; flex-direction:column; gap:4px; max-height:70vh; overflow-y:auto; }
  .scenario-row{
    display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:8px; cursor:pointer;
    border:1px solid transparent;
  }
  .scenario-row:hover{ background:var(--surface-2); }
  .scenario-row.selected{ background:var(--accent-weak); border-color:var(--accent); }
  .scenario-row .idx{ font-family:var(--mono); font-size:11px; color:var(--text-faint); width:16px; text-align:right; flex:none; }
  .scenario-row .name{ flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill{ font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.04em; padding:2px 7px; border-radius:999px; flex:none; white-space:nowrap; }
  .pill.PASS, .pill.BOOK, .pill.REGISTER, .pill.RESCHEDULE, .pill.CANCEL{ background:var(--pass-weak); color:var(--pass); }
  .pill.FAIL, .pill.SUBMIT_FAILED{ background:var(--fail-weak); color:var(--fail); }
  .pill.NO_ACTION{ background:var(--neutral-weak); color:var(--neutral); }
  .pill.IN_PROGRESS, .pill.ESCALATE, .pill.ABANDONED{ background:var(--warn-weak); color:var(--warn); }
  .pill.mode{ background:var(--surface-3); color:var(--text-dim); }
  .scenario-row .dur{ font-family:var(--mono); font-size:11px; color:var(--text-faint); flex:none; width:44px; text-align:right; }

  .main{ display:flex; flex-direction:column; gap:16px; min-width:0; }
  .scenario-header{ padding:16px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  .scenario-header h2{ margin:0; font-size:16px; font-family:var(--mono); font-weight:600; word-break:break-all; }
  .scenario-header .meta{ display:flex; gap:14px; color:var(--text-dim); font-size:12px; font-family:var(--mono); flex-wrap:wrap; }
  .scenario-header .meta b{ color:var(--text); font-weight:600; }

  .timeline-wrap{ padding:16px 18px 10px; position:sticky; top:16px; z-index:5; background:var(--surface); box-shadow:0 8px 16px -12px rgba(0,0,0,.4); }
  .timeline-wrap h3, .transcript h3{
    margin:0 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);
  }
  .lanes{ position:relative; }
  .lane{ position:relative; height:30px; border-top:1px solid var(--border); }
  /* One segment per lane-body, all driven to the same left:X% by the audio's
     currentTime -- since lanes are flush against each other (no gaps), the
     stack of per-lane segments reads as one continuous vertical playhead. */
  .timeline-playhead{
    position:absolute; top:0; bottom:0; width:2px; background:var(--accent);
    pointer-events:none; z-index:4; left:0%; transform:translateX(-50%);
  }
  /* Same one-segment-per-lane-body trick as the playhead, but for the tick
     gridlines -- so markers/bars in every lane always line up against the
     same 0s/10s/20s/... reference the axis row shows below them. */
  .timeline-gridline{
    position:absolute; top:0; bottom:0; width:1px; background:var(--border);
    pointer-events:none; z-index:1; left:0%;
  }
  .lane:first-child{ border-top:none; }
  .lane-label{
    position:absolute; left:-2px; top:50%; transform:translateY(-50%);
    font-size:10px; font-family:var(--mono); color:var(--text-faint); background:var(--surface);
    padding-right:6px; z-index:2; pointer-events:none;
  }
  .lane-body{ position:relative; height:100%; margin-left:74px; }
  .marker{
    position:absolute; top:50%; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:3px;
    cursor:pointer; box-shadow:0 0 0 2px var(--surface);
  }
  .marker.diamond{ border-radius:2px; transform:translate(-50%,-50%) rotate(45deg); }
  .marker.dot{ border-radius:50%; }
  .marker.selected{ outline:2px solid var(--text); outline-offset:2px; }
  .span-bar{
    position:absolute; top:50%; transform:translateY(-50%); height:12px; border-radius:5px;
    background:var(--lane-speech-fill); border:1px solid var(--lane-speech); cursor:pointer; min-width:3px;
  }
  .tick{ position:absolute; top:0; bottom:0; width:1px; background:var(--border); }
  .tick-lbl{ position:absolute; bottom:-16px; transform:translateX(-50%); font-size:9.5px; font-family:var(--mono); color:var(--text-faint); }
  .axis-row{ height:16px; margin-left:74px; position:relative; margin-top:2px; }

  .tooltip{
    position:fixed; z-index:50; background:var(--text); color:var(--bg); font-family:var(--mono);
    font-size:11.5px; padding:6px 9px; border-radius:6px; max-width:340px; pointer-events:none;
    box-shadow:0 4px 16px rgba(0,0,0,.25); line-height:1.35; display:none;
  }

  .transcript{ padding:14px 16px; min-width:0; }

  .transcript-list{
    max-height:480px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    scrollbar-width:thin; scrollbar-color:var(--text-faint) transparent;
  }
  .transcript-list::-webkit-scrollbar{ width:9px; }
  .transcript-list::-webkit-scrollbar-track{ background:transparent; }
  .transcript-list::-webkit-scrollbar-thumb{ background:var(--text-faint); border-radius:999px; border:2px solid var(--surface); background-clip:padding-box; }
  .transcript-list::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); background-clip:padding-box; }
  .msg{ border-radius:8px; padding:8px 10px; border:1px solid var(--border); background:var(--surface-2); }
  .msg.role-user{ background:var(--accent-weak); border-color:var(--accent); }
  .msg.role-assistant{ background:var(--role-assistant-weak); border-color:var(--role-assistant); }
  .msg.role-developer{ background:var(--warn-weak); border-color:var(--warn); }
  .msg.role-tool{ background:var(--surface-3); }
  .msg .role{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:4px; }
  .msg .content{ white-space:pre-wrap; font-size:12.5px; }
  .msg .tool-call{ font-family:var(--mono); font-size:11.5px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin-top:4px; }
  .msg .tool-call .fn{ color:var(--lane-fn); font-weight:600; }
  .msg.highlighted{ outline:2px solid var(--text); }

  /* Consecutive same-role turns are grouped into one tinted block, each turn
     inside it a smaller box in an alternating tone -- so a back-and-forth
     of many short user or assistant turns still reads as one speaker. */
  .msg-group{ border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:5px; }
  .msg-group.role-user{ background:var(--accent-weak); border:1px solid var(--accent); }
  .msg-group.role-assistant{ background:var(--role-assistant-weak); border:1px solid var(--role-assistant); }
  .msg-group .group-role{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); padding:0 2px; }
  .msg-group.role-user .msg, .msg-group.role-assistant .msg{ background:transparent; border-color:transparent; padding:6px 8px; }
  .msg-group .msg.tint-a{ background:var(--tint-a); }
  .msg-group .msg.tint-b{ background:var(--tint-b); }
  .msg-group.role-assistant .msg.role-tool{ border-left:2px solid var(--lane-fn); padding-left:8px; }
  .msg-group.role-assistant .msg.role-developer{ border-left:2px solid var(--warn); padding-left:8px; }
  .msg-group .msg[data-t]{ cursor:pointer; }

  .audio-row{ margin-top:12px; }
  .audio-player{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 14px 6px 6px; }
  .audio-player .play-btn{
    flex:none; width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:var(--surface); display:flex; align-items:center; justify-content:center;
  }
  .audio-player .play-btn:hover{ filter:brightness(1.08); }
  .audio-player .play-btn svg{ width:13px; height:13px; }
  .audio-player .play-btn .icon-pause{ display:none; }
  .audio-player.playing .icon-play{ display:none; }
  .audio-player.playing .icon-pause{ display:flex; }
  .audio-player .time{ font-family:var(--mono); font-size:11px; color:var(--text-dim); flex:none; width:34px; text-align:center; }
  .audio-player input[type="range"].seek{
    flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:999px;
    background:linear-gradient(to right, var(--accent) 0%, var(--border) 0%); outline:none; cursor:pointer; margin:0;
  }
  .audio-player input[type="range"].seek::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent);
    border:2px solid var(--surface); box-shadow:0 0 0 1px var(--accent); cursor:pointer;
  }
  .audio-player input[type="range"].seek::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--accent); cursor:pointer;
  }
  .audio-player input[type="range"].seek::-moz-range-track{ background:transparent; height:4px; border-radius:999px; }

  .empty{ color:var(--text-faint); font-size:12px; padding:8px 2px; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px; color:var(--text-dim); font-family:var(--mono); margin-top:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  .empty-state{ padding:40px 24px; text-align:center; color:var(--text-dim); }
  .empty-state h3{ margin:0 0 8px; color:var(--text); font-size:15px; }
  .empty-state code{ font-family:var(--mono); background:var(--surface-2); border:1px solid var(--border); padding:2px 6px; border-radius:5px; font-size:12.5px; color:var(--text); }
  .empty-state .cmds{ display:inline-flex; flex-direction:column; gap:8px; margin-top:14px; text-align:left; }
  .rec-badge{ font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:999px; background:var(--surface-3); color:var(--text-dim); }

  .run-picker{ display:flex; align-items:center; gap:8px; }
  .run-picker select{
    font-family:var(--mono); font-size:12.5px; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:7px; padding:6px 8px;
  }
  .refresh-btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:7px;
    padding:6px 12px; cursor:pointer;
  }
  .refresh-btn:hover{ background:var(--surface-2); }
  .live-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pass); margin-right:6px; }
</style>

<div class="app">
  <section id="tab-real">
    <header class="top">
      <div class="title-block">
        <h1>Real Call Explorer</h1>
        <div class="sub" id="real-sub"><span class="live-dot"></span>loading…</div>
      </div>
      <div class="run-picker">
        <button class="refresh-btn" id="real-refresh">Refresh</button>
      </div>
      <div class="stats" id="real-stats"></div>
    </header>

    <div id="real-body"></div>
  </section>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  var state = { realData:null, realFilter:'all', realSelectedIdx:null, realSelectedEventIdx:null };
  var realLaneY = { lifecycle:0, issues:1, user:2, assistant:3, overlap:4 };
  var realLaneLabels = ['lifecycle','issues','user','assistant','talking over'];
  var realKindLane = {
    call_start:'lifecycle', connected:'lifecycle', disconnected:'lifecycle',
    error:'issues', warning:'issues'
  };
  var realKindColorVar = {
    call_start:'--lane-turn', connected:'--lane-turn', disconnected:'--text-faint',
    error:'--fail', warning:'--warn'
  };

  function fmtSec(t){ return (Math.round(t*10)/10).toFixed(1) + 's'; }
  function fmtTs(ts){
    // ts like 20260919-140000 -> 2026-09-19 14:00:00
    var m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/.exec(ts);
    if (!m) return ts;
    return m[1]+'-'+m[2]+'-'+m[3]+' '+m[4]+':'+m[5]+':'+m[6];
  }
  function callDisplayName(c){ return c.caller_name || fmtTs(c.started_at); }

  function niceTicks(max){
    if (max <= 0) return [0];
    var step = max <= 12 ? 2 : max <= 30 ? 5 : max <= 80 ? 10 : max <= 200 ? 30 : 60;
    var ticks = [];
    for (var v=0; v<max; v+=step) ticks.push(v);
    // The real duration is always the last tick -- but drop the regular
    // step tick right before it if they'd land too close together, instead
    // of showing both jammed into the same spot at the right edge.
    if (ticks.length && (max - ticks[ticks.length-1]) < max*0.06) ticks.pop();
    ticks.push(max);
    return ticks;
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function showTip(e, text){
    var tip = document.getElementById('tooltip');
    tip.textContent = text;
    tip.style.display = 'block';
    var x = e.clientX + 14, y = e.clientY + 14;
    var vw = window.innerWidth, vh = window.innerHeight;
    tip.style.left = Math.min(x, vw - 350) + 'px';
    tip.style.top = Math.min(y, vh - 80) + 'px';
  }
  function hideTip(){ document.getElementById('tooltip').style.display = 'none'; }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function statTile(num, lbl, extraCls){
    var t = el('div', 'stat ' + (extraCls||''));
    t.appendChild(el('div','num', String(num)));
    t.appendChild(el('div','lbl', lbl));
    return t;
  }

  // Shared by the transcript panel. Consecutive turns from the same
  // speaker (user or assistant) are wrapped in one tinted block instead of
  // each getting its own full-color box, so a multi-part turn reads as one
  // block by that speaker rather than a stack of look-alike bubbles.
  function buildMsgBox(msg, showRoleLabel, onMsgClick){
    var box = el('div','msg role-'+msg.role);
    if (showRoleLabel) box.appendChild(el('div','role', msg.role));
    if (msg.content) box.appendChild(el('div','content', escapeHtml(msg.content)));
    if (msg.tool_calls){
      msg.tool_calls.forEach(function(tc){
        box.appendChild(el('div','tool-call', '<span class="fn">'+escapeHtml(tc.name)+'</span>(' + escapeHtml(tc.arguments||'') + ')'));
      });
    }
    box.dataset.content = msg.content || '';
    if (msg.t != null) box.dataset.t = msg.t;
    if (onMsgClick){
      box.style.cursor = 'pointer';
      box.onclick = function(){ onMsgClick(msg, box); };
    }
    return box;
  }

  // Consecutive turns from the same speaker are wrapped in one tinted block
  // instead of each getting its own full-color box, so a multi-part turn
  // reads as one block by that speaker rather than a stack of look-alike
  // bubbles. A tool result is the *outcome* of the assistant's own function
  // call, not a third speaker, so it rides along inside the assistant's
  // block as a smaller, green-edged sub-box rather than breaking it in two.
  function renderTranscript(list, entries, emptyMsg, onMsgClick){
    list.innerHTML = '';
    if (!entries.length){ list.appendChild(el('div','empty', emptyMsg)); return; }
    var i = 0;
    while (i < entries.length){
      var role = entries[i].role;
      var groupRole = role === 'user' ? 'user' : (role === 'assistant' || role === 'developer') ? 'assistant' : null;
      if (groupRole){
        var group = el('div','msg-group role-'+groupRole);
        group.appendChild(el('div','group-role', groupRole));
        var n = 0;
        while (i < entries.length && (entries[i].role === groupRole || (groupRole === 'assistant' && (entries[i].role === 'tool' || entries[i].role === 'developer')))){
          var box = buildMsgBox(entries[i], entries[i].role !== groupRole, onMsgClick);
          box.classList.add(n % 2 === 0 ? 'tint-a' : 'tint-b');
          group.appendChild(box);
          i++; n++;
        }
        list.appendChild(group);
      } else {
        list.appendChild(buildMsgBox(entries[i], true, onMsgClick));
        i++;
      }
    }
  }

  // ============================================================ REAL CALLS TAB
  function renderReal(){
    var d = state.realData;
    var calls = d.calls || [];
    document.getElementById('real-sub').innerHTML = '<span class="live-dot"></span>' + (calls.length
      ? calls.length + ' recorded call(s) · server/run-logs/'
      : 'server/run-logs/ (webrtc + twilio)');

    var stats = document.getElementById('real-stats');
    stats.innerHTML = '';
    var booked = calls.filter(function(c){return c.outcome==='BOOK';}).length;
    var failed = calls.filter(function(c){return c.outcome==='SUBMIT_FAILED';}).length;
    stats.appendChild(statTile(calls.length, 'calls', ''));
    stats.appendChild(statTile(booked, 'booked', booked ? 'pass-tile' : ''));
    stats.appendChild(statTile(failed, 'submit failed', failed ? 'fail-tile' : ''));

    var body = document.getElementById('real-body');
    body.innerHTML = '';

    if (!calls.length){
      var panel = el('div','panel empty-state');
      panel.innerHTML =
        '<h3>No real calls recorded yet</h3>' +
        '<p>This tab reads <code>server/run-logs/&lt;webrtc|twilio&gt;-&lt;timestamp&gt;/bot.log</code> — ' +
        'produced by an actual voice session, not the eval harness.</p>' +
        '<div class="cmds">' +
        '<div><code>make run-webrtc</code> — talk to the bot in the browser at localhost:7860</div>' +
        '<div><code>make run-twilio</code> — run it as a Twilio Media Streams server</div>' +
        '<div><code>RECORD_CALLS=1 make run-webrtc</code> — also save the call audio</div>' +
        '</div>' +
        '<p style="margin-top:14px">Then re-run the dashboard data generator to pick up the new run.</p>';
      body.appendChild(panel);
      return;
    }

    var layout = el('div','layout');
    var sidebar = el('aside','panel sidebar');
    sidebar.innerHTML = '<div class="filters" id="real-filters"></div><div class="scenario-list" id="real-list"></div>';
    var main = el('main','main');
    main.innerHTML =
      '<div class="panel scenario-header"><h2 id="real-name">—</h2><div class="meta" id="real-meta"></div></div>' +
      '<div class="panel timeline-wrap"><h3>Timeline</h3><div class="lanes" id="real-lanes"></div>' +
      '<div class="axis-row" id="real-axis"></div>' +
      '<div class="legend">' +
      '<span><i style="background:var(--lane-turn)"></i>lifecycle</span>' +
      '<span><i style="background:var(--fail)"></i>error</span>' +
      '<span><i style="background:var(--warn)"></i>warning</span>' +
      '<span><i style="background:var(--accent-weak);border:1px solid var(--accent)"></i>user talking</span>' +
      '<span><i style="background:var(--role-assistant-weak);border:1px solid var(--role-assistant)"></i>assistant talking</span>' +
      '<span><i style="background:var(--lane-fn)"></i>tool calling</span>' +
      '<span><i style="background:var(--lane-speech-fill);border:1px solid var(--lane-speech)"></i>talking over</span>' +
      '</div>' +
      '<div class="audio-row" id="real-audio-row"></div>' +
      '</div>' +
      '<div class="panel transcript"><h3>Conversation transcript</h3><div class="transcript-list" id="real-transcript-list"></div></div>';

    layout.appendChild(sidebar);
    layout.appendChild(main);
    body.appendChild(layout);

    renderRealFilters();
    renderRealSidebar();
    if (state.realSelectedIdx == null || state.realSelectedIdx >= calls.length) state.realSelectedIdx = 0;
    renderRealCall();
  }

  function renderRealFilters(){
    var calls = state.realData.calls;
    var counts = { all: calls.length };
    calls.forEach(function(c){ counts[c.mode] = (counts[c.mode]||0) + 1; });
    // Chips are derived from whatever modes are actually present (carlos,
    // migui, unknown, ...) instead of a hardcoded transport list, so a new
    // person tag on a run-logs folder just shows up on its own.
    var modes = Object.keys(counts).filter(function(k){ return k !== 'all'; }).sort();
    var pairs = [['all','All']].concat(modes.map(function(m){
      return [m, m.charAt(0).toUpperCase() + m.slice(1)];
    }));
    var wrap = document.getElementById('real-filters');
    wrap.innerHTML = '';
    pairs.forEach(function(pair){
      var c = el('div', 'chip' + (state.realFilter===pair[0]?' active':''), pair[1] + ' (' + counts[pair[0]] + ')');
      c.onclick = function(){ state.realFilter = pair[0]; renderRealFilters(); renderRealSidebar(); };
      wrap.appendChild(c);
    });
  }

  function renderRealSidebar(){
    var calls = state.realData.calls;
    var list = document.getElementById('real-list');
    list.innerHTML = '';
    calls.forEach(function(c, i){
      if (state.realFilter !== 'all' && c.mode !== state.realFilter) return;
      var row = el('div', 'scenario-row' + (i===state.realSelectedIdx?' selected':''));
      row.appendChild(el('div','pill mode', c.mode));
      row.appendChild(el('div','name', callDisplayName(c)));
      row.onclick = function(){ state.realSelectedIdx = i; state.realSelectedEventIdx = null; renderRealSidebar(); renderRealCall(); };
      list.appendChild(row);
    });
  }

  function renderRealCall(){
    var c = state.realData.calls[state.realSelectedIdx];
    document.getElementById('real-name').textContent = callDisplayName(c);
    var meta = document.getElementById('real-meta');
    meta.innerHTML = '';
    meta.appendChild(el('span', null, '<b>' + c.outcome + '</b>'));
    meta.appendChild(el('span', null, c.mode + ' · ' + fmtTs(c.started_at)));
    meta.appendChild(el('span', null, 'duration <b>' + fmtSec(c.duration) + '</b>'));
    meta.appendChild(el('span', null, 'events <b>' + c.events.length + '</b>'));
    meta.appendChild(el('span', null, escapeHtml(c.call_id || 'no call id')));
    if (c.recording){
      meta.appendChild(el('span','rec-badge', 'recording: ' + c.recording));
    }

    renderRealTimeline(c);
    renderRealAudio(c);
    renderRealTranscript(c);
  }

  function renderRealTimeline(c){
    var lanesEl = document.getElementById('real-lanes');
    lanesEl.innerHTML = '';
    var max = Math.max(c.duration, 1);

    realLaneLabels.forEach(function(lbl){
      var lane = el('div','lane');
      lane.appendChild(el('div','lane-label', lbl));
      lane.appendChild(el('div','lane-body'));
      lanesEl.appendChild(lane);
    });
    var laneBodies = lanesEl.querySelectorAll('.lane-body');
    var ticks = niceTicks(max);
    laneBodies.forEach(function(body){
      ticks.forEach(function(v){
        var g = el('div','timeline-gridline');
        g.style.left = (v/max*100) + '%';
        body.appendChild(g);
      });
      body.appendChild(el('div','timeline-playhead'));
    });

    c.events.forEach(function(ev, idx){
      var laneName = realKindLane[ev.kind];
      if (!laneName) return;
      var laneIdx = realLaneY[laneName];
      var colorVar = realKindColorVar[ev.kind];
      var shape = laneName === 'lifecycle' ? 'diamond' : 'dot';
      var m = el('div','marker ' + shape);
      m.style.left = (ev.t/max*100) + '%';
      m.style.background = 'var(' + colorVar + ')';
      m.dataset.idx = idx;
      m.onmouseenter = function(e){ showTip(e, fmtSec(ev.t) + '  ' + ev.detail); };
      m.onmousemove = function(e){ showTip(e, fmtSec(ev.t) + '  ' + ev.detail); };
      m.onmouseleave = hideTip;
      m.onclick = function(){ selectRealEvent(idx); };
      laneBodies[laneIdx].appendChild(m);
    });

    function renderSpanLane(spans, laneName, label, background, border){
      (spans || []).forEach(function(sp){
        var left = sp.start/max*100, width = Math.max((sp.end-sp.start)/max*100, 0.6);
        var bar = el('div','span-bar');
        bar.style.left = left + '%';
        bar.style.width = width + '%';
        bar.style.background = background;
        bar.style.borderColor = border;
        bar.onmouseenter = function(e){ showTip(e, label + ' ' + fmtSec(sp.start) + ' → ' + fmtSec(sp.end) + ' (' + fmtSec(sp.end-sp.start) + ')'); };
        bar.onmousemove = function(e){ showTip(e, label + ' ' + fmtSec(sp.start) + ' → ' + fmtSec(sp.end)); };
        bar.onmouseleave = hideTip;
        bar.onclick = function(){
          var audio = realAudioEl();
          if (audio) audio.currentTime = sp.start;
          lastAudioMatchIdx = highlightRealTranscriptAt(nearestTranscriptIdxAt(c, sp.start));
        };
        laneBodies[realLaneY[laneName]].appendChild(bar);
      });
    }
    renderSpanLane(c.user_spans, 'user', 'user talking', 'var(--accent-weak)', 'var(--accent)');
    renderSpanLane(c.assistant_spans, 'assistant', 'assistant talking', 'var(--role-assistant-weak)', 'var(--role-assistant)');
    renderSpanLane(c.tool_spans, 'assistant', 'tool calling', 'var(--lane-fn)', 'var(--lane-fn)');
    renderSpanLane(c.overlap_spans, 'overlap', 'talking over', 'var(--lane-speech-fill)', 'var(--lane-speech)');

    var axis = document.getElementById('real-axis');
    axis.innerHTML = '';
    ticks.forEach(function(v){
      var t = el('div','tick'); t.style.left = (v/max*100)+'%'; axis.appendChild(t);
      var l = el('div','tick-lbl', v+'s'); l.style.left = (v/max*100)+'%'; axis.appendChild(l);
    });

    highlightSelectedRealMarker();
  }

  function highlightSelectedRealMarker(){
    document.querySelectorAll('#real-lanes .marker').forEach(function(m){
      m.classList.toggle('selected', Number(m.dataset.idx) === state.realSelectedEventIdx);
    });
  }

  function selectRealEvent(idx, seekAudio){
    state.realSelectedEventIdx = idx;
    highlightSelectedRealMarker();
    var c = state.realData.calls[state.realSelectedIdx];
    var evT = c.events[idx].t;
    lastAudioMatchIdx = highlightRealTranscriptAt(nearestTranscriptIdxAt(c, evT));
    if (seekAudio !== false){
      var audio = realAudioEl();
      if (audio) audio.currentTime = evT;
    }
  }

  // Fallback for calls logged before entries carried real timestamps (below):
  // text an event carries that could also appear verbatim in the transcript
  // (a reprompt line the bot spoke, or a submission result).
  function realEventMatchText(ev){
    if (ev.kind === 'reprompt' && ev.message) return ev.message;
    if (ev.kind === 'submitted' && ev.result) return ev.result;
    return null;
  }

  function highlightRealTranscriptByText(text){
    document.querySelectorAll('#real-transcript-list .msg').forEach(function(m){ m.classList.remove('highlighted'); });
    if (!text) return;
    var needle = text.trim().slice(0, 24);
    if (!needle) return;
    var msgs = document.querySelectorAll('#real-transcript-list .msg');
    for (var i=0;i<msgs.length;i++){
      var content = msgs[i].dataset.content || '';
      if (content && (content.indexOf(needle) > -1 || needle.indexOf(content.slice(0,24)) > -1)){
        msgs[i].classList.add('highlighted');
        msgs[i].scrollIntoView({block:'center'});
        break;
      }
    }
  }

  function selectRealEventByTranscriptContent(text){
    if (!text) return;
    var c = state.realData.calls[state.realSelectedIdx];
    var needle = text.trim().slice(0, 24);
    if (!needle) return;
    for (var i=0;i<c.events.length;i++){
      var mt = realEventMatchText(c.events[i]);
      if (mt && (mt.indexOf(needle) > -1 || needle.indexOf(mt.slice(0,24)) > -1)){
        selectRealEvent(i);
        return;
      }
    }
  }

  function renderRealTranscript(c){
    renderTranscript(
      document.getElementById('real-transcript-list'),
      c.transcript,
      'No transcript captured — real-call runs default to LOG_LEVEL=INFO (no conversation content on disk). Set LOG_LEVEL=DEBUG to capture it.',
      onRealTranscriptClick
    );
  }

  // Clicking a transcript box seeks the recording to the moment that turn
  // was logged (real_parser.py stamps each entry from the "Generating chat
  // from context" snapshots). Older logs captured before that existed have
  // no per-entry `t`, so they fall back to the old text-match heuristic.
  function onRealTranscriptClick(msg, box){
    var audio = realAudioEl();
    if (audio && msg.t != null){
      var boxes = document.querySelectorAll('#real-transcript-list .msg');
      lastAudioMatchIdx = highlightRealTranscriptAt(Array.prototype.indexOf.call(boxes, box));
      audio.currentTime = msg.t;
    } else {
      selectRealEventByTranscriptContent(msg.content);
    }
  }

  // ============================================================ REAL CALL AUDIO
  // The wav (RECORD_CALLS=1) and the transcript's own per-entry timestamps
  // share the same t=0 (call start), so playback position and the transcript
  // can be kept in sync off that shared clock -- turn-accurate, not word-exact.
  var lastAudioMatchIdx = -1;

  function realAudioEl(){ return document.getElementById('real-audio-player'); }

  function fmtClock(t){
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ':' + (s<10?'0':'') + s;
  }

  var ICON_PLAY = '<svg class="icon-play" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l10-5.5-10-5.5z"/></svg>';
  var ICON_PAUSE = '<svg class="icon-pause" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>';

  function updateRealPlayhead(t){
    var c = state.realData.calls[state.realSelectedIdx];
    if (!c) return;
    var max = Math.max(c.duration, 1);
    var pct = Math.max(0, Math.min(100, t/max*100));
    document.querySelectorAll('#real-lanes .timeline-playhead').forEach(function(seg){ seg.style.left = pct + '%'; });
  }

  function renderRealAudio(c){
    lastAudioMatchIdx = -1;
    var row = document.getElementById('real-audio-row');
    row.innerHTML = '';
    if (!c.recording){
      row.appendChild(el('div','empty','No recording for this call — set RECORD_CALLS=1 to save call audio.'));
      return;
    }

    var audio = document.createElement('audio');
    audio.id = 'real-audio-player';
    audio.preload = 'metadata';
    audio.src = '/api/recordings/' + encodeURIComponent(c.recording);
    audio.style.display = 'none';

    var player = el('div','audio-player');
    var playBtn = el('button','play-btn', ICON_PLAY + ICON_PAUSE);
    playBtn.type = 'button';
    var curTime = el('span','time', '0:00');
    var seek = document.createElement('input');
    seek.type = 'range'; seek.className = 'seek'; seek.min = '0'; seek.max = '0'; seek.value = '0'; seek.step = '0.1';
    var dur = el('span','time', '0:00');

    var dragging = false;
    function paintSeekFill(){
      var max = Number(seek.max) || 0;
      var pct = max ? (Number(seek.value)/max*100) : 0;
      seek.style.background = 'linear-gradient(to right, var(--accent) ' + pct + '%, var(--border) ' + pct + '%)';
    }

    playBtn.onclick = function(){ if (audio.paused) audio.play(); else audio.pause(); };
    audio.onplay = function(){ player.classList.add('playing'); };
    audio.onpause = function(){ player.classList.remove('playing'); };
    audio.onloadedmetadata = function(){ seek.max = String(audio.duration || 0); dur.textContent = fmtClock(audio.duration); paintSeekFill(); };
    audio.ontimeupdate = function(){
      if (!dragging) seek.value = String(audio.currentTime);
      curTime.textContent = fmtClock(audio.currentTime);
      paintSeekFill();
      updateRealPlayhead(audio.currentTime);
      syncTranscriptToAudioTime(audio.currentTime);
    };
    seek.oninput = function(){
      dragging = true; curTime.textContent = fmtClock(Number(seek.value)); paintSeekFill();
      updateRealPlayhead(Number(seek.value));
    };
    seek.onchange = function(){ dragging = false; audio.currentTime = Number(seek.value); };

    player.appendChild(playBtn);
    player.appendChild(curTime);
    player.appendChild(seek);
    player.appendChild(dur);

    row.appendChild(audio);
    row.appendChild(player);
  }

  function nearestTranscriptIdxAt(c, t){
    var idx = -1;
    for (var i=0;i<c.transcript.length;i++){
      var et = c.transcript[i].t;
      if (et == null) continue;
      if (et <= t) idx = i; else break;
    }
    return idx;
  }

  function highlightRealTranscriptAt(idx){
    var boxes = document.querySelectorAll('#real-transcript-list .msg');
    boxes.forEach(function(m){ m.classList.remove('highlighted'); });
    if (idx == null || idx < 0 || !boxes[idx]) return idx;
    boxes[idx].classList.add('highlighted');
    boxes[idx].scrollIntoView({block:'center'});
    return idx;
  }

  function syncTranscriptToAudioTime(t){
    var c = state.realData.calls[state.realSelectedIdx];
    if (!c) return;
    var idx = nearestTranscriptIdxAt(c, t);
    if (idx === lastAudioMatchIdx) return;
    lastAudioMatchIdx = highlightRealTranscriptAt(idx);
  }

  // ============================================================ LIVE DATA (local server API)
  function loadRealCalls(){
    fetch('/api/real-calls').then(function(r){ return r.json(); }).then(function(d){
      state.realData = d;
      renderReal();
    }).catch(function(err){
      document.getElementById('real-sub').textContent = 'Failed to reach dashboard server: ' + err;
    });
  }

  // ============================================================ BOOT
  document.getElementById('real-refresh').onclick = loadRealCalls;
  loadRealCalls();
})();
</script>
